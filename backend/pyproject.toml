[project]
name = "dajesa-backend"
version = "0.1.0"
description = "Backend SENA - FastAPI + Supabase"
readme = "README-backend.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "supabase>=2.5.0",
    "PyJWT>=2.8.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
