<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAJESA - Control Administrativo SENA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            display: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    .admin-shell {
      background-color: #f8fafc;
      min-height: 100vh;
    }
    .admin-layout {
      display: flex;
      min-height: 100vh;
      align-items: stretch;
      flex-direction: row;
    }
    .admin-main {
      flex: 1;
      min-width: 0;
      padding-left: 1rem;
    }
    .admin-topbar {
      position: sticky;
      top: 0;
      width: 260px;
      min-width: 260px;
      height: 100vh;
      background-color: #17321a;
      border-right: 1px solid rgba(255,255,255,0.08);
      box-shadow: 8px 0 20px rgba(18, 31, 19, 0.12);
      z-index: 40;
    }
    .admin-sidebar-inner {
      height: 100%;
      padding: 1.25rem 1rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
    }
    .admin-logo-frame {
      width: 42px;
      height: 42px;
      border-radius: 9999px;
      overflow: hidden;
      background: #39A900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .admin-nav {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      width: 100%;
    }
    .admin-nav-link {
      padding: 0.75rem 0.875rem;
      border-radius: 0.9rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      transition: all 0.2s;
      width: 100%;
    }
    .admin-nav-link:hover, .admin-nav-link.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }
    .admin-nav-icon {
      font-size: 0.7rem;
      opacity: 0.5;
    }
    .admin-user-chip {
      background: rgba(255, 255, 255, 0.08);
      padding: 0.25rem 0.75rem 0.25rem 0.375rem;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .admin-logout {
      color: rgba(255,255,255,0.8);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255,255,255,0.15);
    }
    .admin-logout:hover {
      color: #fff;
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.4);
    }
    .admin-hero {
      background: linear-gradient(135deg, #17321a 0%, #0d1e10 100%);
      position: relative;
    }
    .admin-hero-image {
      opacity: 0;
      transition: opacity 1s ease-in-out;
      background-size: cover;
      background-position: center;
    }
    .admin-hero-image.is-active {
      opacity: 0.35;
    }
    .admin-hero-overlay {
      background: linear-gradient(180deg, rgba(23,50,26,0.3) 0%, rgba(13,30,16,0.85) 100%);
    }
    .admin-live-dot {
      width: 8px;
      height: 8px;
      background-color: #a3e635;
      border-radius: 9999px;
      box-shadow: 0 0 10px #a3e635;
    }
    .admin-hero-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.3);
      transition: all 0.3s;
    }
    .admin-hero-dot.is-active {
      width: 24px;
      background: #a3e635;
    }
    .admin-hero-mark {
      font-size: 8rem;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.03);
      letter-spacing: 0.05em;
      pointer-events: none;
      font-family: 'Outfit', sans-serif;
    }
    .admin-stat {
      background: #ffffff;
      border-color: #f1f5f9;
    }
    .admin-table-head {
      background-color: #f8fafc;
      border-bottom: 1px solid #f1f5f9;
    }
    .admin-table-row:hover {
      background-color: #f8fafc;
    }
  </style>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const AREAS = [
      "Tecnología de la Información y las Comunicaciones",
      "Finanzas y Administración",
      "Industria de la Alimentación",
      "Educación",
      "Turismo, Hotelería y Restauración",
      "Electricidad y Energía",
      "Mecánica",
      "Trabajo Social y Desarrollo Comunitario",
      "Comunicación, Arte y Diseño",
      "Gestión del Talento Humano",
      "Construcción e Infraestructura",
      "Comercio, Marketing y Logística",
      "Otra",
    ];

    const EMPTY_PROGRAM = {
      name: "",
      code: "",
      duration: "",
      level: "Técnico",
      area: "",
      description: "",
      skills: [],
      modalidad: "Presencial",
      titulacion: "",
    };

    const HERO_PROGRAM_IMAGES = [
      { url: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1800&q=85", label: "Tecnología y desarrollo" },
      { url: "https://images.unsplash.com/photo-1556910103-1c02745aae4d?auto=format&fit=crop&w=1800&q=85", label: "Gastronomía y alimentos" },
      { url: "https://images.unsplash.com/photo-1509391366360-2e959784a276?auto=format&fit=crop&w=1800&q=85", label: "Electricidad y energía" },
      { url: "https://images.unsplash.com/photo-1503387762-592dea58ef21?auto=format&fit=crop&w=1800&q=85", label: "Construcción e infraestructura" },
    ];

    const INITIAL_PROGRAMS = [
      {
        id: "p_1",
        name: "Análisis y Desarrollo de Software",
        code: "228118",
        duration: "24 meses",
        level: "Tecnólogo",
        area: "Tecnología de la Información y las Comunicaciones",
        description: "Formación integral en desarrollo web, aplicaciones móviles, bases de datos y arquitectura de software.",
        skills: ["JavaScript", "Python", "Bases de Datos", "Metodologías Ágiles"],
        modalidad: "Presencial",
        titulacion: "Tecnólogo en Análisis y Desarrollo de Software"
      },
      {
        id: "p_2",
        name: "Mantenimiento de Equipos de Cómputo",
        code: "228119",
        duration: "12 meses",
        level: "Técnico",
        area: "Tecnología de la Información y las Comunicaciones",
        description: "Diagnóstico, ensamble, mantenimiento preventivo/correctivo y configuración de redes locales.",
        skills: ["Mantenimiento Hardware", "Redes LAN", "Sistemas Operativos"],
        modalidad: "Presencial",
        titulacion: "Técnico en Sistemas"
      },
      {
        id: "p_3",
        name: "Gastronomía y Cocina Internacional",
        code: "634101",
        duration: "12 meses",
        level: "Técnico",
        area: "Industria de la Alimentación",
        description: "Preparación de alimentos, técnicas culinarias profesionales, higiene y manipulación.",
        skills: ["Técnicas Culinarias", "Manipulación de Alimentos", "Repostería"],
        modalidad: "Presencial",
        titulacion: "Técnico en Cocina"
      },
      {
        id: "p_4",
        name: "Electricidad Industrial",
        code: "821201",
        duration: "24 meses",
        level: "Tecnólogo",
        area: "Electricidad y Energía",
        description: "Montaje, automatización y mantenimiento de sistemas eléctricos en entornos industriales.",
        skills: ["Tableros Eléctricos", "PLCs", "Automatización"],
        modalidad: "Presencial",
        titulacion: "Tecnólogo en Electricidad Industrial"
      }
    ];

    const INITIAL_EVIDENCE = [
      {
        id: "e_1",
        fileName: "Jornada_Tecnologia_2026.jpg",
        fileType: "image/jpeg",
        fileData: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=400&q=80",
        description: "Jornada práctica de capacitación en desarrollo de software y nuevas tecnologías.",
        createdAt: new Date().toISOString()
      }
    ];

    function loadPrograms() {
      const stored = localStorage.getItem("sena_programs");
      if (stored) {
        try { return JSON.parse(stored); } catch (e) {}
      }
      return INITIAL_PROGRAMS;
    }

    function savePrograms(programs) {
      localStorage.setItem("sena_programs", JSON.stringify(programs));
    }

    function loadEvidence() {
      const stored = localStorage.getItem("sena_evidence");
      if (stored) {
        try { return JSON.parse(stored); } catch (e) {}
      }
      return INITIAL_EVIDENCE;
    }

    function saveEvidence(evidence) {
      localStorage.setItem("sena_evidence", JSON.stringify(evidence));
    }

    function SenaLogo({ size = 36 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="rounded-full shadow-sm flex-shrink-0">
          <circle cx="50" cy="50" r="50" fill="#39A900" />
          <circle cx="50" cy="30" r="10" fill="#FFFFFF" />
          <path d="M50 45 L25 80 L38 80 L50 62 L62 80 L75 80 Z" fill="#FFFFFF" />
          <circle cx="50" cy="52" r="4" fill="#39A900" />
        </svg>
      );
    }

    function ProgramModal({ initial, onSave, onClose }) {
      const [form, setForm] = useState(initial ? { ...initial } : { ...EMPTY_PROGRAM });
      const [skillInput, setSkillInput] = useState("");
      const [errors, setErrors] = useState({});

      function set(key, value) {
        setForm((f) => ({ ...f, [key]: value }));
        setErrors((e) => ({ ...e, [key]: "" }));
      }

      function addSkill() {
        const s = skillInput.trim();
        if (s && !form.skills.includes(s)) {
          set("skills", [...form.skills, s]);
        }
        setSkillInput("");
      }

      function removeSkill(s) {
        set("skills", form.skills.filter((x) => x !== s));
      }

      function validate() {
        const e = {};
        if (!form.name.trim()) e.name = "Nombre requerido";
        if (!form.code.trim()) e.code = "Código requerido";
        if (!form.duration.trim()) e.duration = "Duración requerida";
        if (!form.area.trim()) e.area = "Área requerida";
        if (!form.description.trim()) e.description = "Descripción requerida";
        if (!form.titulacion.trim()) e.titulacion = "Titulación requerida";
        setErrors(e);
        return Object.keys(e).length === 0;
      }

      function handleSave() {
        if (!validate()) return;
        onSave({ ...form, id: initial?.id ?? `p_${Date.now()}` });
      }

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,0.5)" }}>
          <div className="bg-white rounded-3xl w-full max-w-2xl max-h-[92vh] overflow-y-auto shadow-2xl">
            <div className="sticky top-0 bg-white border-b border-gray-100 px-6 py-4 flex items-center justify-between rounded-t-3xl z-10">
              <h2 className="font-display font-800 text-lg text-gray-900" style={{ fontFamily: "Outfit, sans-serif", fontWeight: 800 }}>
                {initial ? "Editar programa" : "Nuevo programa"}
              </h2>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center hover:bg-gray-200 transition-colors">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <path d="M2 2l10 10M12 2L2 12" stroke="#374151" strokeWidth="2" strokeLinecap="round" />
                </svg>
              </button>
            </div>

            <div className="p-6 space-y-5">
              <div>
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Nivel de formación</label>
                <div className="flex gap-2">
                  {["Técnico", "Tecnólogo"].map((lvl) => (
                    <button
                      key={lvl}
                      type="button"
                      onClick={() => set("level", lvl)}
                      className="flex-1 py-2.5 rounded-xl text-sm font-semibold border-2 transition-all duration-150"
                      style={{
                        borderColor: form.level === lvl ? "#39A900" : "#e5e7eb",
                        background: form.level === lvl ? "#e8f7de" : "white",
                        color: form.level === lvl ? "#2d8400" : "#6b7280",
                      }}
                    >
                      {lvl}
                    </button>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="md:col-span-2">
                  <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Nombre del programa *</label>
                  <input
                    value={form.name}
                    onChange={(e) => set("name", e.target.value)}
                    placeholder="Ej: Técnica en Sistemas"
                    className="w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none transition-all focus:border-green-400 focus:ring-2 focus:ring-green-50"
                    style={{ borderColor: errors.name ? "#ef4444" : "#e5e7eb" }}
                  />
                  {errors.name && <p className="text-xs text-red-500 mt-1">{errors.name}</p>}
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Código SENA *</label>
                  <input
                    value={form.code}
                    onChange={(e) => set("code", e.target.value)}
                    placeholder="Ej: 228118"
                    className="w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none transition-all focus:border-green-400 focus:ring-2 focus:ring-green-50"
                    style={{ borderColor: errors.code ? "#ef4444" : "#e5e7eb" }}
                  />
                  {errors.code && <p className="text-xs text-red-500 mt-1">{errors.code}</p>}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="md:col-span-2">
                  <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Área de conocimiento *</label>
                  <select
                    value={form.area}
                    onChange={(e) => set("area", e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none transition-all focus:border-green-400 bg-white"
                    style={{ borderColor: errors.area ? "#ef4444" : "#e5e7eb" }}
                  >
                    <option value="">Selecciona un área</option>
                    {AREAS.map((a) => <option key={a} value={a}>{a}</option>)}
                  </select>
                  {errors.area && <p className="text-xs text-red-500 mt-1">{errors.area}</p>}
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Duración *</label>
                  <input
                    value={form.duration}
                    onChange={(e) => set("duration", e.target.value)}
                    placeholder="Ej: 12 meses"
                    className="w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none transition-all focus:border-green-400 focus:ring-2 focus:ring-green-50"
                    style={{ borderColor: errors.duration ? "#ef4444" : "#e5e7eb" }}
                  />
                  {errors.duration && <p className="text-xs text-red-500 mt-1">{errors.duration}</p>}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Modalidad</label>
                  <select
                    value={form.modalidad}
                    onChange={(e) => set("modalidad", e.target.value)}
                    className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm outline-none focus:border-green-400 bg-white"
                  >
                    <option>Presencial</option>
                    <option>Virtual</option>
                    <option>A distancia</option>
                    <option>Presencial / Virtual</option>
                    <option>Presencial / A distancia</option>
                  </select>
                </div>
                <div>
                  <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Titulación *</label>
                  <input
                    value={form.titulacion}
                    onChange={(e) => set("titulacion", e.target.value)}
                    placeholder="Ej: Técnico en Sistemas"
                    className="w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none transition-all focus:border-green-400 focus:ring-2 focus:ring-green-50"
                    style={{ borderColor: errors.titulacion ? "#ef4444" : "#e5e7eb" }}
                  />
                  {errors.titulacion && <p className="text-xs text-red-500 mt-1">{errors.titulacion}</p>}
                </div>
              </div>

              <div>
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Descripción del programa *</label>
                <textarea
                  value={form.description}
                  onChange={(e) => set("description", e.target.value)}
                  placeholder="Describe de qué trata el programa, qué forma y para qué perfil..."
                  rows={3}
                  className="w-full px-3.5 py-2.5 rounded-xl border text-sm outline-none transition-all focus:border-green-400 focus:ring-2 focus:ring-green-50 resize-none"
                  style={{ borderColor: errors.description ? "#ef4444" : "#e5e7eb" }}
                />
                {errors.description && <p className="text-xs text-red-500 mt-1">{errors.description}</p>}
              </div>

              <div>
                <label className="block text-xs font-semibold text-gray-500 uppercase tracking-wide mb-1.5">Competencias clave</label>
                <div className="flex gap-2 mb-2">
                  <input
                    value={skillInput}
                    onChange={(e) => setSkillInput(e.target.value)}
                    onKeyDown={(e) => e.key === "Enter" && (e.preventDefault(), addSkill())}
                    placeholder="Escribe y presiona Enter o +"
                    className="flex-1 px-3.5 py-2 rounded-xl border border-gray-200 text-sm outline-none focus:border-green-400 transition-all"
                  />
                  <button
                    type="button"
                    onClick={addSkill}
                    className="w-9 h-9 rounded-xl flex items-center justify-center flex-shrink-0 transition-opacity hover:opacity-80"
                    style={{ background: "#39A900" }}
                  >
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                      <path d="M7 1v12M1 7h12" stroke="white" strokeWidth="2" strokeLinecap="round" />
                    </svg>
                  </button>
                </div>
                {form.skills.length > 0 && (
                  <div className="flex flex-wrap gap-1.5">
                    {form.skills.map((s) => (
                      <span key={s} className="flex items-center gap-1.5 text-xs bg-green-50 text-green-800 border border-green-100 px-2.5 py-1 rounded-full">
                        {s}
                        <button onClick={() => removeSkill(s)} className="text-green-600 hover:text-red-500 transition-colors">
                          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
                            <path d="M2 2l6 6M8 2L2 8" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
                          </svg>
                        </button>
                      </span>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="sticky bottom-0 bg-white border-t border-gray-100 px-6 py-4 flex gap-3 rounded-b-3xl">
              <button onClick={onClose} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">
                Cancelar
              </button>
              <button onClick={handleSave} className="flex-1 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 hover:opacity-90" style={{ background: "#39A900", color: "white" }}>
                {initial ? "Guardar cambios" : "Crear programa"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function DeleteConfirm({ name, onConfirm, onCancel }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,0.5)" }}>
          <div className="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <div className="w-12 h-12 rounded-2xl bg-red-50 flex items-center justify-center mx-auto mb-4">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke="#ef4444" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
            </div>
            <h3 className="font-display font-700 text-gray-900 text-center mb-2" style={{ fontFamily: "Outfit, sans-serif", fontWeight: 700 }}>¿Eliminar programa?</h3>
            <p className="text-sm text-gray-500 text-center mb-5">
              Se eliminará <strong>"{name}"</strong> permanentemente. Esta acción no se puede deshacer.
            </p>
            <div className="flex gap-2">
              <button onClick={onCancel} className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">
                Cancelar
              </button>
              <button onClick={onConfirm} className="flex-1 py-2.5 rounded-xl text-sm font-semibold bg-red-500 text-white hover:bg-red-600 transition-colors">
                Eliminar
              </button>
            </div>
          </div>
        </div>
      );
    }

    function AdminDashboard({ programs, onUpdate, evidence, onEvidenceUpdate, user, onLogout }) {
      const [modal, setModal] = useState(null);
      const [deleteTarget, setDeleteTarget] = useState(null);
      const [search, setSearch] = useState("");
      const [filterLevel, setFilterLevel] = useState("all");
      const [toast, setToast] = useState(null);
      const [evidenceDescription, setEvidenceDescription] = useState("");
      const [fileInputKey, setFileInputKey] = useState(0);
      const [selectedEvidenceFile, setSelectedEvidenceFile] = useState(null);
      const [selectedEvidenceProgram, setSelectedEvidenceProgram] = useState("general");
      const [heroImageIndex, setHeroImageIndex] = useState(0);

      useEffect(() => {
        const timer = window.setInterval(() => {
          setHeroImageIndex((current) => (current + 1) % HERO_PROGRAM_IMAGES.length);
        }, 5000);
        return () => window.clearInterval(timer);
      }, []);

      const tecnicas = programs.filter((p) => p.level === "Técnico");
      const tecnologias = programs.filter((p) => p.level === "Tecnólogo");
      const selectedProgram = programs.find((program) => program.id === selectedEvidenceProgram);
      const visibleEvidence = evidence.filter((item) =>
        selectedEvidenceProgram === "general"
          ? !item.programId
          : item.programId === selectedEvidenceProgram
      );

      const filtered = programs.filter((p) => {
        const matchSearch = p.name.toLowerCase().includes(search.toLowerCase()) ||
          p.area.toLowerCase().includes(search.toLowerCase()) ||
          p.code.includes(search);
        const matchLevel = filterLevel === "all" || p.level === filterLevel;
        return matchSearch && matchLevel;
      });

      function showToast(msg) {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      }

      function handleSave(p) {
        let updated;
        if (modal?.type === "edit") {
          updated = programs.map((x) => x.id === p.id ? p : x);
          showToast("Programa actualizado correctamente");
        } else {
          updated = [...programs, p];
          showToast("Programa creado correctamente");
        }
        savePrograms(updated);
        onUpdate(updated);
        setModal(null);
      }

      function handleDelete(p) {
        const updated = programs.filter((x) => x.id !== p.id);
        const evidenceWithoutProgram = evidence.filter((item) => item.programId !== p.id);
        savePrograms(updated);
        saveEvidence(evidenceWithoutProgram);
        onUpdate(updated);
        onEvidenceUpdate(evidenceWithoutProgram);
        if (selectedEvidenceProgram === p.id) setSelectedEvidenceProgram("general");
        setDeleteTarget(null);
        showToast("Programa eliminado");
      }

      function handleEvidenceUpload() {
        const file = selectedEvidenceFile;
        if (!file) return;
        if (!evidenceDescription.trim()) {
          showToast("Escribe una descripción para la evidencia");
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          showToast("El archivo no puede superar 5 MB");
          return;
        }

        const reader = new FileReader();
        reader.onload = () => {
          const item = {
            id: `e_${Date.now()}`,
            ...(selectedProgram ? { programId: selectedProgram.id } : {}),
            fileName: file.name,
            fileType: file.type || "application/octet-stream",
            fileData: String(reader.result),
            description: evidenceDescription.trim(),
            createdAt: new Date().toISOString(),
          };
          const updated = [item, ...evidence];
          saveEvidence(updated);
          onEvidenceUpdate(updated);
          setEvidenceDescription("");
          setSelectedEvidenceFile(null);
          setFileInputKey((key) => key + 1);
          showToast(selectedProgram ? "Evidencia asignada al programa" : "Evidencia general publicada");
        };
        reader.readAsDataURL(file);
      }

      function handleEvidenceDelete(id) {
        const updated = evidence.filter((item) => item.id !== id);
        saveEvidence(updated);
        onEvidenceUpdate(updated);
        showToast("Evidencia eliminada");
      }

      return (
        <div className="min-h-screen admin-shell">
          <div className="admin-layout">
            <header className="admin-topbar z-30 shadow-md">
              <div className="admin-sidebar-inner">
                <div>
                  <div className="flex items-center gap-3 mb-6">
                    <div className="admin-logo-frame float-logo">
                      <SenaLogo size={42} />
                    </div>
                    <div>
                      <p className="font-display font-800 text-white text-sm leading-none" style={{ fontFamily: "Outfit, sans-serif", fontWeight: 800 }}>DAJESA</p>
                      <p className="text-[11px] text-white/60 mt-1">Control administrativo</p>
                    </div>
                  </div>

                  <nav className="admin-nav" aria-label="Navegación administrativa">
                    <a href="#resumen" className="admin-nav-link active"><span className="admin-nav-icon">01</span>Resumen</a>
                    <a href="#programas" className="admin-nav-link"><span className="admin-nav-icon">02</span>Programas</a>
                    <a href="#evidencias" className="admin-nav-link"><span className="admin-nav-icon">03</span>Evidencias</a>
                  </nav>
                </div>

                <div className="flex flex-col gap-3">
                  <div className="flex items-center gap-2 admin-user-chip justify-center">
                    <div className="w-8 h-8 rounded-full bg-lime-400 flex items-center justify-center text-[#17321a] text-xs font-bold">
                      {user.name[0]}
                    </div>
                    <span className="text-[11px] font-semibold text-white/90">{user.name}</span>
                  </div>
                  <button onClick={onLogout} className="admin-logout flex items-center justify-center gap-1.5 px-3 py-2.5 rounded-xl text-xs font-semibold transition-colors cursor-pointer">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                      <path d="M5 7h7M9 5l2 2-2 2" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
                      <path d="M8 3V2H2v10h6v-1" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
                    </svg>
                    Cerrar sesión
                  </button>
                </div>
              </div>
            </header>

            <main id="resumen" className="admin-main max-w-7xl mx-auto px-4 py-8 md:py-10">
            <div className="admin-hero mb-8 rounded-[2rem] p-6 md:p-9 text-white overflow-hidden relative shadow-lg">
              {HERO_PROGRAM_IMAGES.map((image, index) => (
                <div
                  key={image.url}
                  className={`admin-hero-image absolute inset-0 ${index === heroImageIndex ? "is-active" : ""}`}
                  style={{ backgroundImage: `url(${image.url})` }}
                  aria-hidden="true"
                />
              ))}
              <div className="admin-hero-overlay absolute inset-0" />
              <div className="relative z-10 max-w-2xl">
                <div className="flex items-center gap-2 text-xs uppercase tracking-[0.2em] text-lime-200 font-semibold"><span className="admin-live-dot" /> Centro de control</div>
                <h1 className="font-display text-3xl md:text-4xl font-800 mt-3" style={{ fontFamily: "Outfit, sans-serif", fontWeight: 800 }}>La oferta educativa,<br /><span className="text-yellow-300">bajo control.</span></h1>
                <p className="text-sm text-white/80 mt-3 max-w-xl leading-relaxed">Administra programas, publica actividades generales y organiza evidencias dentro de cada programa de formación.</p>
              </div>
              <div className="admin-hero-caption absolute bottom-5 left-6 md:left-9 z-10 text-[11px] uppercase tracking-[0.14em] text-white/60">{HERO_PROGRAM_IMAGES[heroImageIndex].label}</div>
              <div className="admin-hero-dots absolute bottom-5 right-6 md:right-9 z-10 flex items-center gap-2">
                {HERO_PROGRAM_IMAGES.map((image, index) => (
                  <button
                    key={image.label}
                    type="button"
                    aria-label={`Mostrar imagen: ${image.label}`}
                    onClick={() => setHeroImageIndex(index)}
                    className={`admin-hero-dot ${index === heroImageIndex ? "is-active" : ""}`}
                  />
                ))}
              </div>
              <div className="admin-hero-mark absolute right-8 md:right-20 top-1/2 -translate-y-1/2 hidden sm:flex">SENA</div>
            </div>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
              {[
                { label: "Total programas", value: programs.length, color: "#39A900", bg: "#e8f7de" },
                { label: "Técnicas", value: tecnicas.length, color: "#2d8400", bg: "#d1f0c2" },
                { label: "Tecnologías", value: tecnologias.length, color: "#1a2e0f", bg: "#c8dbbe" },
                { label: "Áreas cubiertas", value: new Set(programs.map((p) => p.area)).size, color: "#F5C800", bg: "#fef9c3" },
              ].map((s) => (
                <div key={s.label} className="admin-stat rounded-2xl p-4 border shadow-sm transition-all hover:shadow-md">
                  <div className="w-10 h-10 rounded-xl flex items-center justify-center mb-4" style={{ background: s.bg }}>
                    <span className="text-lg font-bold" style={{ color: s.color }}>{s.value}</span>
                  </div>
                  <p className="text-xs text-slate-500 font-medium">{s.label}</p>
                </div>
              ))}
            </div>

            <div className="admin-toolbar flex flex-col sm:flex-row gap-3 mb-6">
              <div className="relative flex-1">
                <svg className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.5" />
                  <path d="M11 11l3 3" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" />
                </svg>
                <input
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Buscar por nombre, código o área..."
                  className="admin-search w-full pl-9 pr-4 py-2.5 rounded-xl border border-gray-200 text-sm outline-none transition-all focus:border-green-400 bg-white"
                />
              </div>
              <div className="flex gap-2">
                {["all", "Técnico", "Tecnólogo"].map((lvl) => (
                  <button
                    key={lvl}
                    onClick={() => setFilterLevel(lvl)}
                    className="admin-filter px-3.5 py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer"
                    style={{
                      background: filterLevel === lvl ? "#1a2e0f" : "white",
                      color: filterLevel === lvl ? "white" : "#6b7280",
                      border: filterLevel === lvl ? "none" : "1px solid #e5e7eb",
                    }}
                  >
                    {lvl === "all" ? "Todos" : lvl}
                  </button>
                ))}
              </div>
              <button
                onClick={() => setModal({ type: "create" })}
                className="admin-primary-button flex items-center gap-2 px-4 py-2.5 rounded-xl text-sm font-semibold transition-all duration-200 hover:opacity-90 whitespace-nowrap cursor-pointer"
                style={{ background: "#39A900", color: "white" }}
              >
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <path d="M7 1v12M1 7h12" stroke="white" strokeWidth="2" strokeLinecap="round" />
                </svg>
                Nuevo programa
              </button>
            </div>

            <div id="programas" className="admin-panel bg-white rounded-2xl border overflow-hidden shadow-sm mb-8">
              <div className="overflow-x-auto">
                <table className="w-full">
                  <thead>
                    <tr className="admin-table-head">
                      {["Programa", "Código", "Nivel", "Área", "Duración", "Modalidad", "Acciones"].map((h) => (
                        <th key={h} className="text-left text-xs font-semibold text-gray-400 uppercase tracking-wide px-4 py-3 whitespace-nowrap">
                          {h}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-gray-50">
                    {filtered.length === 0 ? (
                      <tr>
                        <td colSpan={7} className="text-center py-12 text-sm text-gray-400">
                          No se encontraron programas con los filtros actuales
                        </td>
                      </tr>
                    ) : (
                      filtered.map((p) => (
                        <tr key={p.id} className="admin-table-row transition-colors">
                          <td className="px-4 py-3">
                            <p className="text-sm font-semibold text-gray-900 max-w-xs leading-snug">{p.name}</p>
                            <p className="text-xs text-gray-400 mt-0.5 line-clamp-1">{p.titulacion}</p>
                          </td>
                          <td className="px-4 py-3">
                            <span className="text-xs font-mono text-gray-500">{p.code}</span>
                          </td>
                          <td className="px-4 py-3">
                            <span
                              className="text-xs font-semibold px-2 py-0.5 rounded-full whitespace-nowrap"
                              style={{
                                background: p.level === "Tecnólogo" ? "#1a2e0f" : "#e8f7de",
                                color: p.level === "Tecnólogo" ? "#F5C800" : "#2d8400",
                              }}
                            >
                              {p.level}
                            </span>
                          </td>
                          <td className="px-4 py-3">
                            <p className="text-xs text-gray-600 max-w-[180px] leading-snug">{p.area}</p>
                          </td>
                          <td className="px-4 py-3">
                            <span className="text-xs font-medium text-green-700 bg-green-50 px-2 py-1 rounded-lg whitespace-nowrap">{p.duration}</span>
                          </td>
                          <td className="px-4 py-3">
                            <p className="text-xs text-gray-500 whitespace-nowrap">{p.modalidad}</p>
                          </td>
                          <td className="px-4 py-3">
                            <div className="flex items-center gap-1">
                              <button onClick={() => setModal({ type: "edit", program: p })} className="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-blue-50 text-blue-500 transition-colors cursor-pointer" title="Editar">
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                  <path d="M10 2l2 2-8 8H2v-2L10 2z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round" />
                                </svg>
                              </button>
                              <button onClick={() => setDeleteTarget(p)} className="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-red-50 text-red-400 transition-colors cursor-pointer" title="Eliminar">
                                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                                  <path d="M2 4h10M5 4V2.5h4V4M11 4l-.8 8H3.8L3 4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" />
                                </svg>
                              </button>
                            </div>
                          </td>
                        </tr>
                      ))
                    )}
                  </tbody>
                </table>
              </div>
              {filtered.length > 0 && (
                <div className="admin-table-footer px-4 py-3 border-t border-gray-100">
                  <p className="text-xs text-gray-400">Mostrando {filtered.length} de {programs.length} programas</p>
                </div>
              )}
            </div>

            <section id="evidencias" className="admin-panel bg-white rounded-3xl border shadow-sm p-5 md:p-6">
              <div className="flex flex-col md:flex-row md:items-start md:justify-between gap-4 mb-5">
                <div>
                  <p className="text-xs font-semibold uppercase tracking-wide" style={{ color: "#39A900" }}>Contenido público</p>
                  <h2 className="font-display font-800 text-xl text-gray-900 mt-1" style={{ fontFamily: "Outfit, sans-serif", fontWeight: 800 }}>Evidencias de actividades</h2>
                  <p className="text-sm text-gray-500 mt-1">Publica contenido general o asígnalo a un programa específico para mantenerlo organizado.</p>
                </div>
                <span className="flex-shrink-0 text-xs font-semibold text-green-700 bg-green-50 px-3 py-1.5 rounded-full">{visibleEvidence.length} en esta vista</span>
              </div>

              <div className="mb-4">
                <label htmlFor="evidence-program" className="block text-xs font-semibold text-gray-600 mb-1.5">Sección de evidencias</label>
                <select id="evidence-program" value={selectedEvidenceProgram} onChange={(event) => setSelectedEvidenceProgram(event.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm outline-none focus:border-green-400 bg-white">
                  <option value="general">Actividades generales del centro</option>
                  {programs.map((program) => <option key={program.id} value={program.id}>{program.name} · {program.code}</option>)}
                </select>
              </div>

              <div className="admin-evidence-composer grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] gap-3 items-end p-4 rounded-2xl border border-gray-200 bg-gray-50/50">
                <div>
                  <label htmlFor="evidence-description" className="block text-xs font-semibold text-gray-600 mb-1.5">Descripción breve</label>
                  <textarea id="evidence-description" value={evidenceDescription} onChange={(event) => setEvidenceDescription(event.target.value)} placeholder="Ej: Jornada de formación práctica en el taller..." rows={2} className="w-full px-3.5 py-2.5 rounded-xl border border-gray-200 text-sm outline-none focus:border-green-400 resize-none bg-white" />
                </div>
                <div>
                  <label htmlFor={`evidence-file-${fileInputKey}`} className="block text-xs font-semibold text-gray-600 mb-1.5">Foto o documento</label>
                  <input
                    key={fileInputKey}
                    id={`evidence-file-${fileInputKey}`}
                    type="file"
                    accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx"
                    onChange={(event) => setSelectedEvidenceFile(event.target.files?.[0] ?? null)}
                    className="w-full text-xs text-gray-500 file:mr-3 file:rounded-lg file:border-0 file:bg-green-100 file:px-3 file:py-2 file:text-xs file:font-semibold file:text-green-800 hover:file:bg-green-200"
                  />
                  <p className="text-[11px] text-gray-400 mt-1 truncate">{selectedEvidenceFile ? selectedEvidenceFile.name : "Tamaño máximo: 5 MB"}</p>
                </div>
                <button
                  type="button"
                  onClick={handleEvidenceUpload}
                  disabled={!selectedEvidenceFile}
                  className="flex items-center justify-center gap-2 px-4 h-10 rounded-xl text-xs font-semibold text-white transition-opacity hover:opacity-90 disabled:opacity-40 disabled:cursor-not-allowed whitespace-nowrap cursor-pointer"
                  style={{ background: "#39A900" }}
                >
                  <svg width="15" height="15" viewBox="0 0 17 17" fill="none"><path d="M8.5 3v8M5 7l3.5-4L12 7M3 12.5v1h11v-1" stroke="white" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" /></svg>
                  {selectedProgram ? "Asignar al programa" : "Publicar general"}
                </button>
              </div>

              {visibleEvidence.length > 0 && (
                <div className="mt-5 grid grid-cols-1 md:grid-cols-2 gap-3">
                  {visibleEvidence.map((item) => (
                    <div key={item.id} className="admin-evidence-item flex items-center gap-3 border rounded-xl p-3 bg-white">
                      {item.fileType.startsWith("image/") ? (
                        <img src={item.fileData} alt="" className="w-14 h-14 rounded-lg object-cover bg-gray-50" />
                      ) : (
                        <div className="w-14 h-14 rounded-lg bg-green-50 flex items-center justify-center text-green-700 text-xs font-bold flex-shrink-0">DOC</div>
                      )}
                      <div className="min-w-0 flex-1">
                        <p className="text-xs font-semibold text-gray-800 truncate">{item.fileName}</p>
                        <p className="text-xs text-gray-500 line-clamp-2 mt-0.5">{item.description}</p>
                      </div>
                      <button onClick={() => handleEvidenceDelete(item.id)} className="w-8 h-8 rounded-lg flex items-center justify-center hover:bg-red-50 text-red-400 transition-colors cursor-pointer" title="Eliminar evidencia" aria-label={`Eliminar ${item.fileName}`}>
                        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M5 4V2.5h4V4M11 4l-.8 8H3.8L3 4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" /></svg>
                      </button>
                    </div>
                  ))}
                </div>
              )}
              {visibleEvidence.length === 0 && (
                <div className="mt-5 rounded-2xl border border-dashed border-gray-200 py-8 text-center bg-gray-50/30">
                  <p className="text-sm font-semibold text-gray-600">Aún no hay evidencias en esta sección</p>
                  <p className="text-xs text-gray-400 mt-1">Selecciona un archivo y agrega una descripción para publicar la primera.</p>
                </div>
              )}
            </section>
          </main>

          </div>

          {modal && <ProgramModal initial={modal.program ?? null} onSave={handleSave} onClose={() => setModal(null)} />}
          {deleteTarget && <DeleteConfirm name={deleteTarget.name} onConfirm={() => handleDelete(deleteTarget)} onCancel={() => setDeleteTarget(null)} />}

          {toast && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-5 py-3 rounded-2xl text-sm font-semibold text-white shadow-xl flex items-center gap-2" style={{ background: "#39A900" }}>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M3 8l4 4 6-7" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
              {toast}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [programs, setPrograms] = useState(loadPrograms);
      const [evidence, setEvidence] = useState(loadEvidence);
      const [user, setUser] = useState({ name: "Administrador SENA", role: "Coordinador Académico" });

      function handleLogout() {
        alert("Sesión cerrada correctamente");
      }

      return (
        <AdminDashboard
          programs={programs}
          onUpdate={setPrograms}
          evidence={evidence}
          onEvidenceUpdate={setEvidence}
          user={user}
          onLogout={handleLogout}
        />
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
